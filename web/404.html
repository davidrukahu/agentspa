<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost in the Spa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
  :root { --bg: #17110e; --text: #f3e9dc; --muted: #b7a593; --teal: #6fd3c7; --line: #3a2b24; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Space Grotesk", system-ui, sans-serif; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  main { text-align: center; max-width: 520px; }
  canvas { width: min(320px, 100%); aspect-ratio: 80 / 45; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 10px; }
  h1 { font-family: "Silkscreen", ui-monospace, monospace; font-weight: 400; font-size: 44px; margin: 18px 0 4px; color: var(--teal); }
  p { margin: 10px 0; font-size: 18px; line-height: 1.5; }
  a { color: var(--teal); font-weight: 700; }
  .back { display: inline-block; margin-top: 14px; color: var(--muted); font-weight: 500; font-size: 15px; }
</style>
</head>
<body>
<main>
  <canvas id="lost" width="80" height="45" aria-hidden="true"></canvas>
  <h1>404</h1>
  <p>Page not found. Here's <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener noreferrer">something that will never let you down</a>.</p>
  <a class="back" href="/">Back to the lobby</a>
</main>
<script>
  // A guest in a robe, wandering an empty hallway, very confused.
  const ctx = document.getElementById("lost").getContext("2d");
  const p = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
  function draw(t) {
    p(0, 0, 80, 45, "#2a201c");
    p(0, 22, 80, 23, "#b89b74");
    for (let x = 0; x < 80; x += 12) p(x, 22, 1, 23, "#a88a63");
    p(0, 30, 80, 8, "#2f6d6a");
    p(0, 30, 80, 1, "#d9b36c");
    p(0, 37, 80, 1, "#d9b36c");
    for (let x = 6; x < 80; x += 24) { p(x, 6, 3, 3, "#ffd98a"); p(x + 1, 9, 1, 2, "#6b4a33"); }

    const s = t / 1000;
    const x = 40 + Math.sin(s * 0.8) * 22;
    const step = Math.floor(s * 6) % 2;
    const top = 22 + (step ? 0 : -1);
    p(x - 3, top, 6, 2, "#5a3825");
    p(x - 2, top + 2, 4, 3, "#e0a98a");
    p(x - 1, top + 3, 1, 1, "#2a1a14");
    p(x + 1, top + 3, 1, 1, "#2a1a14");
    p(x - 3, top + 5, 6, 5, "#f7f4ee");
    p(x - 3, top + 7, 6, 1, "#6fd3c7");
    p(x - 2, top + 10, 1, step ? 1 : 2, "#e0a98a");
    p(x + 1, top + 10, 1, step ? 2 : 1, "#e0a98a");

    // Question marks bobbing overhead.
    const q = (qx, qy) => { p(qx, qy, 3, 1, "#f4c95d"); p(qx + 2, qy + 1, 1, 1, "#f4c95d"); p(qx + 1, qy + 2, 1, 1, "#f4c95d"); p(qx + 1, qy + 4, 1, 1, "#f4c95d"); };
    q(x - 5, top - 7 + Math.round(Math.sin(s * 3)));
    q(x + 3, top - 8 + Math.round(Math.sin(s * 3 + 1.5)));
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
